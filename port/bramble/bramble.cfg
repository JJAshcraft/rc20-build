# Bramble settings. Lines starting with # are ignored.
# Open the INPUT TEST page (L1 from the first page) to see what each button reports.

# If A/B or X/Y come out swapped on your device, set these to 1.
swap_ab = 0
swap_xy = 0

# Flip the right stick's up/down (it moves the filter cutoff).
invert_ry = 0

# Audio buffer in samples. Raise to 1024 if you hear crackles, lower to 256 for less lag.
audio_buffer = 512

# Ignore the SDL gamepad layout and use raw joystick numbers instead.
# Set force_raw = 1, then fill in the raw numbers shown on the INPUT TEST page.
force_raw = 0
