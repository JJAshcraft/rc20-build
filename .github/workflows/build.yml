name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-14
            cmake_args: -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          - name: Windows
            os: windows-latest
            cmake_args: ""
          - name: Linux
            os: ubuntu-24.04
            cmake_args: -DPATINA_BUILD_TESTS=ON
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxext-dev libxcomposite-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Smoke test
        if: runner.os == 'Linux'
        run: ./build/PatinaSmokeTest_artefacts/Release/PatinaSmokeTest .

      - name: Upload plugins
        uses: actions/upload-artifact@v4
        with:
          name: Patina-${{ matrix.name }}
          path: |
            build/Patina_artefacts/Release/VST3
            build/Patina_artefacts/Release/AU
            build/Patina_artefacts/Release/Standalone
          if-no-files-found: ignore
